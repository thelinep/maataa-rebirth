[package]
name = "maataa-auth-api"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Local-first MAATAA Auth and API runtime foundation"

[dependencies]
base64 = "0.22.1"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["backup", "bundled", "functions", "hooks"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
